{% set name = "dask-core" %}
{% set version = "2026.7.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name.split('-')[0] }}/{{ name.split('-')[0] }}-{{ version }}.tar.gz
  sha256: b039970642ce97a063070bae2763dada8aae27e3cbd8ff6d894072f920a1e252

build:
  number: 0
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  entry_points:
    - dask = dask.__main__:main

# Please note the repo used is the same as `dask`
# Only the minimum reqs needed to build `dask` go here
# Optional dependencies should exist in `dask` recipe
requirements:
  host:
    - python
    - pip
    - setuptools >=80
    - setuptools-scm >=9
  run:
    - python
    - click >=8.1
    - cloudpickle >=3.0.0
    - fsspec >=2021.09.0
    - packaging >=20.0
    - partd >=1.4.0
    - pyyaml >=5.4.1
    - toolz >=0.12.0
    - importlib-metadata >=4.13.0  # [py<312]
  run_constrained:
    - numpy >=1.24
    - pandas >=2.0
    - pyarrow >=16.0
    - distributed =={{ version }}.*
    - bokeh >=3.1.0
    - jinja2 >=2.10.3
    - lz4 >=4.3.2

# Tests must be added in the dask recipe:
# https://github.com/AnacondaRecipes/dask-feedstock/blob/master/recipe/meta.yaml
test:
  source_files:
    - dask/tests
    - dask/dask.yaml
    - dask/dask-schema.yaml
  imports:
    - dask
  requires:
    - pip
    - pytest
  commands:
    - pip check
    - pytest -v dask/tests -k "not (test_register_command_ep or test_cpu_count_cgroups_v2)"

# Note: The build and dependency order for dask-distributed packages are as follows.
# dask-core -> @dask-expr@ -> distributed -> dask
# dask-core removed from the host section inside the dask-expr. Please check future releases, it may be returned.
about:
  home: https://github.com/dask/dask
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: Parallel computing with task scheduling
  description: Dask is a flexible parallel computing library for analytics.
  doc_url: https://docs.dask.org
  dev_url: https://github.com/dask/dask

extra:
  recipe-maintainers:
    - jakirkham
    - jcrist
    - martindurant
    - mrocklin
    - pitrou
    - shoyer
    - sinhrks
    - tomaugspurger
    - jrbourbeau
  skip-lints:
    - python_build_tool_in_run
    - host_section_needs_exact_pinnings